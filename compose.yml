name: financeclaw-java

x-runtime: &runtime
  image: financeclaw-java:m5
  build: .
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: 768m
  depends_on:
    init-db:
      condition: service_completed_successfully

x-release: &release
  SPRING_CONFIG_IMPORT: configtree:/run/secrets/
  FINANCECLAW_DATABASE_URL: jdbc:postgresql://postgres:5432/financeclaw_java
  FINANCECLAW_DATABASE_USER: financeclaw_app
  FINANCECLAW_TENANT: ${FINANCECLAW_TENANT:-local}
  FINANCECLAW_SUBJECT: ${FINANCECLAW_SUBJECT:-developer}
  FINANCECLAW_MODEL: ${FINANCECLAW_MODEL:-offline}
  FINANCECLAW_MODEL_BASE_URL: ${FINANCECLAW_MODEL_BASE_URL:-}
  FINANCECLAW_MODEL_THINKING: ${FINANCECLAW_MODEL_THINKING:-false}
  FINANCECLAW_CONTEXT_SYSTEM_BYTES: ${FINANCECLAW_CONTEXT_SYSTEM_BYTES:-8192}
  FINANCECLAW_CONTEXT_LONG_MEMORY_BYTES: ${FINANCECLAW_CONTEXT_LONG_MEMORY_BYTES:-16384}
  FINANCECLAW_CONTEXT_WORK_CONTEXT_BYTES: ${FINANCECLAW_CONTEXT_WORK_CONTEXT_BYTES:-24576}
  FINANCECLAW_CONTEXT_CURRENT_INPUT_BYTES: ${FINANCECLAW_CONTEXT_CURRENT_INPUT_BYTES:-8192}
  FINANCECLAW_CONTEXT_TOOL_SCHEMA_BYTES: ${FINANCECLAW_CONTEXT_TOOL_SCHEMA_BYTES:-16384}
  FINANCECLAW_CONTEXT_TOOL_RESULT_BYTES: ${FINANCECLAW_CONTEXT_TOOL_RESULT_BYTES:-8192}
  FINANCECLAW_CONTEXT_SUMMARY_BYTES: ${FINANCECLAW_CONTEXT_SUMMARY_BYTES:-2048}
  FINANCECLAW_CONTEXT_COMPACT_AT_PERCENT: ${FINANCECLAW_CONTEXT_COMPACT_AT_PERCENT:-80}
  FINANCECLAW_CONTEXT_RETAINED_ROUNDS: ${FINANCECLAW_CONTEXT_RETAINED_ROUNDS:-1}
  FINANCECLAW_ZIWEI_ENABLED: ${FINANCECLAW_ZIWEI_ENABLED:-false}
  FINANCECLAW_ZIWEI_DEVELOPMENT: ${FINANCECLAW_ZIWEI_DEVELOPMENT:-false}
  FINANCECLAW_ZIWEI_KEY_REF: ZIWEI_HMAC_KEY
  FINANCECLAW_ZIWEI_KEY_VERSION: ${FINANCECLAW_ZIWEI_KEY_VERSION:-}
  FINANCECLAW_ZIWEI_QUERY_TIMEZONE: ${FINANCECLAW_ZIWEI_QUERY_TIMEZONE:-Asia/Shanghai}
  FINANCECLAW_HOTEL_ENABLED: ${FINANCECLAW_HOTEL_ENABLED:-false}
  FINANCECLAW_HOTEL_URL: ${FINANCECLAW_HOTEL_URL:-https://mcp.rollinggo.cn/mcp}
  FINANCECLAW_HOTEL_ALLOWED_HOSTS: ${FINANCECLAW_HOTEL_ALLOWED_HOSTS:-mcp.rollinggo.cn}
  FINANCECLAW_HOTEL_TENANTS: ${FINANCECLAW_TENANT:-local}
  FINANCECLAW_TAIBU_ENABLED: ${FINANCECLAW_TAIBU_ENABLED:-false}
  FINANCECLAW_TAIBU_URL: ${FINANCECLAW_TAIBU_URL:-}
  FINANCECLAW_TAIBU_ALLOWED_HOSTS: ${FINANCECLAW_TAIBU_ALLOWED_HOSTS:-}
  FINANCECLAW_TAIBU_CREDENTIAL_REF: TAIBU_TOKEN
  FINANCECLAW_TAIBU_TENANTS: ${FINANCECLAW_TENANT:-local}
  FINANCECLAW_MEMORY_ENABLED: ${FINANCECLAW_MEMORY_ENABLED:-false}
  FINANCECLAW_PROFILE_ENABLED: ${FINANCECLAW_PROFILE_ENABLED:-true}
  FINANCECLAW_MEMORY_VECTOR_SEARCH: ${FINANCECLAW_MEMORY_VECTOR_SEARCH:-false}
  FINANCECLAW_EMBEDDING_MODEL: ${FINANCECLAW_EMBEDDING_MODEL:-}
  FINANCECLAW_EMBEDDING_BASE_URL: ${FINANCECLAW_EMBEDDING_BASE_URL:-}
  FINANCECLAW_EMBEDDING_REVISION: ${FINANCECLAW_EMBEDDING_REVISION:-local-no-embedding-v1}

x-feishu: &feishu
  FINANCECLAW_FEISHU_ENABLED: ${FINANCECLAW_FEISHU_ENABLED:-false}
  FINANCECLAW_FEISHU_APP_ID: ${FINANCECLAW_FEISHU_APP_ID:-}
  FINANCECLAW_FEISHU_TENANT_KEY: ${FINANCECLAW_FEISHU_TENANT_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    environment:
      POSTGRES_DB: financeclaw_java
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_admin_password, db_schema_password, db_app_password, db_memory_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/postgres-init.sql:/docker-entrypoint-initdb.d/10-financeclaw.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d financeclaw_java']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 768m

  init-db:
    <<: *runtime
    command: [init-db, --financeclaw.deployment.grants=true]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      FINANCECLAW_DATABASE_URL: jdbc:postgresql://postgres:5432/financeclaw_java
      FINANCECLAW_DATABASE_USER: financeclaw
    secrets:
      - source: db_schema_password
        target: spring.datasource.password

  api:
    <<: *runtime
    # HTTP, AgentScope execution and delivery share one event stream and connection pool.
    command: [standalone]
    ports: ['127.0.0.1:${FINANCECLAW_HTTP_PORT:-8080}:8080']
    environment:
      <<: [*release, *feishu]
    secrets:
      - source: ziwei_key
        target: ZIWEI_HMAC_KEY
      - source: db_app_password
        target: spring.datasource.password
      - source: api_token
        target: financeclaw.auth.token
      - source: model_key
        target: financeclaw.model.api-key
      - source: hotel_token
        target: ROLLINGGO_TOKEN
      - source: taibu_token
        target: TAIBU_TOKEN
      - source: embedding_key
        target: financeclaw.memory.embedding.api-key
      - source: feishu_secret
        target: financeclaw.feishu.app-secret
      - source: feishu_token
        target: financeclaw.feishu.verification-token
      - source: feishu_encrypt_key
        target: financeclaw.feishu.encrypt-key

  memory-worker:
    <<: *runtime
    command: [memory-worker]
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      FINANCECLAW_MEMORY_DATABASE_URL: jdbc:postgresql://postgres:5432/financeclaw_java
      FINANCECLAW_MEMORY_DATABASE_USER: financeclaw_memory
      FINANCECLAW_MEMORY_HTTP_ENABLED: 'true'
      FINANCECLAW_MEMORY_MODEL: ${FINANCECLAW_MEMORY_MODEL:-}
      FINANCECLAW_MEMORY_MODEL_BASE_URL: ${FINANCECLAW_MEMORY_MODEL_BASE_URL:-}
      FINANCECLAW_EMBEDDING_MODEL: ${FINANCECLAW_EMBEDDING_MODEL:-}
      FINANCECLAW_EMBEDDING_BASE_URL: ${FINANCECLAW_EMBEDDING_BASE_URL:-}
      FINANCECLAW_EMBEDDING_REVISION: ${FINANCECLAW_EMBEDDING_REVISION:-local-no-embedding-v1}
    secrets:
      - source: db_memory_password
        target: spring.datasource.password
      - source: memory_model_key
        target: financeclaw.memory.extractor.api-key
      - source: embedding_key
        target: financeclaw.memory.embedding.api-key

volumes:
  postgres-data:

secrets:
  db_admin_password:
    file: .secrets/db-admin
  db_schema_password:
    file: .secrets/db-schema
  db_app_password:
    file: .secrets/db-app
  db_memory_password:
    file: .secrets/db-memory
  api_token:
    file: .secrets/api-token
  model_key:
    file: .secrets/model-key
  ziwei_key:
    file: .secrets/ziwei-key
  memory_model_key:
    file: .secrets/memory-model-key
  embedding_key:
    file: .secrets/embedding-key
  hotel_token:
    file: .secrets/hotel-token
  taibu_token:
    file: .secrets/taibu-token
  feishu_secret:
    file: .secrets/feishu-secret
  feishu_token:
    file: .secrets/feishu-token
  feishu_encrypt_key:
    file: .secrets/feishu-encrypt-key
