# 通用 MCP 接入。配置密钥并启用服务后，scripts/deploy.py 自动补齐缺失契约。
# enabled=false 不读取契约或认证；绑定保留，启用后自动装配到对应 Agent。
# 运行身份还需 travel:read；紫微/八字启用时根任务为 confidential，须明确部署策略。
# 具体导入、授权与数据级别配置见 docs/operations/mcp.md。
[defaults]
timeout_seconds = 30

[servers.rollinggo_hotel]
enabled = true
transport = "streamable_http"
url = "https://mcp.rollinggo.cn/mcp"
allowed_hosts = ["mcp.rollinggo.cn"]
allowed_tools = ["searchHotels", "getHotelDetail", "getHotelSearchTags"]
contracts = "mcp/rollinggo_hotel.json"

[servers.rollinggo_hotel.auth]
type = "bearer"
token_env = "FINANCECLAW_ROLLINGGO_API_KEY"

[servers.rollinggo_hotel.policy]
side_effect = "read"
required_scopes = ["travel:read"]
egress = "external"
# 当前根启用紫微后统一使用 confidential；此处允许它提交酒店查询参数。
allowed_data_classes = ["public", "internal", "confidential"]

[servers.rollinggo_hotel.result_views.searchHotels]
delivery = "reference"
collection_path = "/hotelInformationList"
preview_fields = ["/hotelId", "/name", "/address", "/starRating", "/price"]
preview_records = 3

[servers.rollinggo_hotel.result_views.getHotelDetail]
delivery = "reference"
collection_path = "/roomRatePlans"
preview_fields = ["/roomName", "/averagePrice", "/currency"]
preview_records = 3

[servers.rollinggo_flight]
enabled = false
transport = "streamable_http"
url = "https://mcp.rollinggo.cn/mcp/flight"
allowed_hosts = ["mcp.rollinggo.cn"]
allowed_tools = ["searchAirports", "searchFlights"]
contracts = "mcp/rollinggo_flight.json"

[servers.rollinggo_flight.auth]
type = "bearer"
token_env = "FINANCECLAW_ROLLINGGO_API_KEY"

[servers.rollinggo_flight.policy]
side_effect = "read"
required_scopes = ["travel:read"]
egress = "external"
allowed_data_classes = ["public", "internal"]

[agents.finance_agent]
mcp_tools = [
  "rollinggo_hotel.searchHotels",
  "rollinggo_hotel.getHotelDetail",
  "rollinggo_hotel.getHotelSearchTags",
  "rollinggo_flight.searchAirports",
  "rollinggo_flight.searchFlights",
]
