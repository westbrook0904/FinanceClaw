services:
  app-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: financeclaw_app
      POSTGRES_USER: financeclaw
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - app-db:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/10-agent-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeclaw -d financeclaw_app"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  artifact-store:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_secret_key
    secrets: [minio_access_key, minio_secret_key]
    volumes: ["artifacts:/data"]

  bff:
    build: .
    env_file: [.env.stage5]
    ports: ["8000:8000"]
    depends_on:
      app-db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  app-db: {}
  redis: {}
  artifacts: {}

secrets:
  postgres_password: {file: ./secrets/postgres_password}
  minio_access_key: {file: ./secrets/minio_access_key}
  minio_secret_key: {file: ./secrets/minio_secret_key}
