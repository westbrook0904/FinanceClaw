spring:
  config:
    import: optional:configtree:/run/secrets/
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
  task:
    execution:
      # Custom schedulers must not disable MVC's applicationTaskExecutor.
      mode: force
      pool:
        core-size: 8
        max-size: 8
        queue-capacity: 256
    scheduling:
      pool:
        size: 2
  application:
    name: financeclaw-java
  datasource:
    url: ${FINANCECLAW_DATABASE_URL:jdbc:postgresql://localhost:5432/financeclaw_java}
    username: ${FINANCECLAW_DATABASE_USER:financeclaw}
    password: ${FINANCECLAW_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
      data-source-properties:
        socketTimeout: 10
        connectTimeout: 5
        options: "-c statement_timeout=5000 -c lock_timeout=3000"
  flyway:
    enabled: true
mybatis:
  configuration:
    cache-enabled: false
    local-cache-scope: STATEMENT
    map-underscore-to-camel-case: true
    default-statement-timeout: 5
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,runtimeStore
server:
  shutdown: graceful
  tomcat:
    threads:
      max: 32
    max-http-form-post-size: 64KB
logging:
  level:
    io.agentscope: OFF
    io.modelcontextprotocol: OFF

financeclaw:
  model:
    name: ${FINANCECLAW_MODEL:offline}
    base-url: ${FINANCECLAW_MODEL_BASE_URL:}
    api-key: ${FINANCECLAW_MODEL_API_KEY:}
    thinking: ${FINANCECLAW_MODEL_THINKING:false}
    input-limit: ${FINANCECLAW_MODEL_INPUT_LIMIT:65536}
    context-window: ${FINANCECLAW_MODEL_CONTEXT_WINDOW:131072}
    output-reserve: ${FINANCECLAW_MODEL_OUTPUT_RESERVE:2048}
    safety-margin: ${FINANCECLAW_MODEL_SAFETY_MARGIN:512}
  fallback:
    name: ${FINANCECLAW_FALLBACK_MODEL:}
    base-url: ${FINANCECLAW_FALLBACK_BASE_URL:}
    input-limit: ${FINANCECLAW_FALLBACK_INPUT_LIMIT:32768}
    context-window: ${FINANCECLAW_FALLBACK_CONTEXT_WINDOW:65536}
    output-reserve: ${FINANCECLAW_FALLBACK_OUTPUT_RESERVE:2048}
    safety-margin: ${FINANCECLAW_FALLBACK_SAFETY_MARGIN:512}
    thinking: ${FINANCECLAW_FALLBACK_THINKING:false}
  auth:
    token: ${FINANCECLAW_API_TOKEN:}
    tenant: ${FINANCECLAW_TENANT:local}
    subject: ${FINANCECLAW_SUBJECT:developer}
  worker:
    enabled: ${FINANCECLAW_WORKER_ENABLED:true}
    parallelism: 4
    # Local scheduling tick; idle database scans back off up to idle-max-ms.
    poll-ms: 250
    idle-max-ms: 5000
    recovery-ms: 2000
    lease-ms: 15000
    heartbeat-ms: 2000
    model-timeout-ms: 30000
  integrations:
    enabled: ${FINANCECLAW_INTEGRATIONS_ENABLED:true}
  business:
    # Operators explicitly enable integrations; disabled services do not resolve credentials or open connections.
    hotel:
      enabled: ${FINANCECLAW_HOTEL_ENABLED:false}
      url: ${FINANCECLAW_HOTEL_URL:https://mcp.rollinggo.cn/mcp}
      allowed-hosts: ${FINANCECLAW_HOTEL_ALLOWED_HOSTS:mcp.rollinggo.cn}
      credential-ref: ${FINANCECLAW_HOTEL_CREDENTIAL_REF:ROLLINGGO_TOKEN}
      external: true
      tenants: ${FINANCECLAW_HOTEL_TENANTS:local}
      timeout-ms: 5000
    taibu:
      enabled: ${FINANCECLAW_TAIBU_ENABLED:false}
      url: ${FINANCECLAW_TAIBU_URL:}
      allowed-hosts: ${FINANCECLAW_TAIBU_ALLOWED_HOSTS:}
      credential-ref: ${FINANCECLAW_TAIBU_CREDENTIAL_REF:}
      external: ${FINANCECLAW_TAIBU_EXTERNAL:false}
      tenants: ${FINANCECLAW_TAIBU_TENANTS:local}
      timeout-ms: 5000
    market-file: ${FINANCECLAW_MARKET_FILE:}
    ziwei:
      enabled: ${FINANCECLAW_ZIWEI_ENABLED:false}
      development: ${FINANCECLAW_ZIWEI_DEVELOPMENT:false}
      key-ref: ${FINANCECLAW_ZIWEI_KEY_REF:ZIWEI_HMAC_KEY}
      key-version: ${FINANCECLAW_ZIWEI_KEY_VERSION:}
      query-timezone: ${FINANCECLAW_ZIWEI_QUERY_TIMEZONE:Asia/Shanghai}
  memory:
    enabled: ${FINANCECLAW_MEMORY_ENABLED:false}
    profile-enabled: ${FINANCECLAW_PROFILE_ENABLED:true}
    vector-search: ${FINANCECLAW_MEMORY_VECTOR_SEARCH:false}
    forget-ledger:
      enabled: ${FINANCECLAW_FORGET_LEDGER_ENABLED:false}
      url: ${FINANCECLAW_FORGET_LEDGER_URL:}
      username: ${FINANCECLAW_FORGET_LEDGER_USER:}
      password: ${FINANCECLAW_FORGET_LEDGER_PASSWORD:}
    extractor:
      model: ${FINANCECLAW_MEMORY_MODEL:}
      base-url: ${FINANCECLAW_MEMORY_MODEL_BASE_URL:}
      api-key: ${FINANCECLAW_MEMORY_MODEL_API_KEY:}
    embedding:
      model: ${FINANCECLAW_EMBEDDING_MODEL:}
      revision: ${FINANCECLAW_EMBEDDING_REVISION:disabled}
      base-url: ${FINANCECLAW_EMBEDDING_BASE_URL:}
      api-key: ${FINANCECLAW_EMBEDDING_API_KEY:}
      dimensions: 1024
  feishu:
    enabled: ${FINANCECLAW_FEISHU_ENABLED:false}
    idle-max-ms: 5000
    recovery-ms: 5000
    app-id: ${FINANCECLAW_FEISHU_APP_ID:}
    app-secret: ${FINANCECLAW_FEISHU_APP_SECRET:}
    verification-token: ${FINANCECLAW_FEISHU_VERIFICATION_TOKEN:}
    encrypt-key: ${FINANCECLAW_FEISHU_ENCRYPT_KEY:}
    tenant-key: ${FINANCECLAW_FEISHU_TENANT_KEY:}
    base-url: ${FINANCECLAW_FEISHU_BASE_URL:https://open.feishu.cn}
  sse:
    max-connections: 32
    timeout-ms: 30000
    heartbeat-ms: 15000
    buffer-capacity: 256
