name: Java M0 through M5
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12+8'
      - name: Static checks and fixed toolchain
        run: |
          python3 scripts/check-delivery.py
          scripts/mvn.sh -B -ntp validate spotless:check
      - name: Unit and native HTTP contract tests (no database or real credentials)
        run: scripts/mvn.sh -B -ntp test
      - name: Package for independent JVM experiments
        run: scripts/mvn.sh -B -ntp package -DskipTests
      - name: Real PostgreSQL and recovery integration tests
        run: scripts/mvn.sh -B -ntp failsafe:integration-test failsafe:verify
      - name: Collect verified test results and source fingerprints
        run: python3 scripts/collect-evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-evidence
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/m*/
      - uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/financeclaw-java-0.1.0-SNAPSHOT.jar
  delivery:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/
      - name: Create local-only test credentials
        run: python3 scripts/init-local.py
      - name: Four roles, failure recovery, offline baseline and backup restore
        run: python3 scripts/validate-compose.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-evidence
          path: |
            target/m5/compose-results.json
            target/m5/compose-validation.log
