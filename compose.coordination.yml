# 独立 Coordinator 角色；.env.coordinator 应由既有环境 profile 与 coordinator 片段组成。
# 先对共享应用库执行 Alembic，HTTPS 入口由部署侧内部代理终止。
services:
  coordinator-ingress:
    build: .
    image: financeclaw-coordination:local
    env_file: [.env.coordinator]
    command:
      - /opt/financeclaw/.venv/bin/uvicorn
      - financeclaw.coordination.ingress.app:create_default_ingress
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports: ["127.0.0.1:8081:8000"]
    restart: unless-stopped
    stop_grace_period: 30s
  coordinator-worker:
    build: .
    image: financeclaw-coordination:local
    env_file: [.env.coordinator]
    command: [/opt/financeclaw/.venv/bin/python, -m, financeclaw.coordination.worker]
    # Worker 没有 HTTP 监听；通过 Ingress/BFF readiness 检查数据库中的独立心跳。
    healthcheck: {disable: true}
    restart: unless-stopped
    stop_grace_period: 150s
