services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: financeclaw_agent
      POSTGRES_USER: financeclaw
      POSTGRES_PASSWORD: financeclaw
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeclaw -d financeclaw_agent"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
