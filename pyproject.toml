[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "financeclaw"
version = "0.1.0"
description = "A financial agent platform built on LangChain and LangGraph."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141,<1",
    "langchain>=1.3.16,<2",
    "langchain-mcp-adapters>=0.2,<1",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langgraph-checkpoint-redis>=0.2,<1",
    "langgraph-cli[inmem]>=0.4,<1",
    "langgraph-sdk>=0.3,<1",
    "langsmith>=0.4,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "redis>=6,<8",
    "uvicorn>=0.52,<1",
]

[project.entry-points."financeclaw.plugins"]
calculator-tool = "calculator_tool:CalculatorToolPlugin"
echo-agent = "echo_agent:EchoAgentPlugin"
mock-finance-agent = "mock_finance_agent:MockFinanceAgentPlugin"
portfolio-risk-agent = "portfolio_risk_agent:PortfolioRiskAgentPlugin"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "external: requires live credentials or services",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools]
py-modules = ["main"]
packages = [
    "financeclaw_spike",
    "harness_bootstrap",
    "harness_contracts",
    "harness_context",
    "harness_events",
    "harness_memory",
    "harness_plugin_local",
    "harness_policy",
    "harness_registry",
    "harness_selection",
    "harness_runtime",
    "harness_spi",
    "harness_trace",
    "calculator_tool",
    "echo_agent",
    "mock_finance_agent",
    "portfolio_risk_agent",
]

[tool.setuptools.package-dir]
financeclaw_spike = "financeclaw_spike"
harness_bootstrap = "harness-bootstrap/src/harness_bootstrap"
harness_contracts = "harness-contracts/src/harness_contracts"
harness_context = "harness-context/src/harness_context"
harness_events = "harness-events/src/harness_events"
harness_memory = "harness-memory/src/harness_memory"
harness_plugin_local = "harness-plugin-local/src/harness_plugin_local"
harness_policy = "harness-policy/src/harness_policy"
harness_registry = "harness-registry/src/harness_registry"
harness_selection = "harness-selection/src/harness_selection"
harness_runtime = "harness-runtime/src/harness_runtime"
harness_spi = "harness-spi/src/harness_spi"
harness_trace = "harness-trace/src/harness_trace"
calculator_tool = "plugins/calculator-tool/src/calculator_tool"
echo_agent = "plugins/echo-agent/src/echo_agent"
mock_finance_agent = "plugins/mock-finance-agent/src/mock_finance_agent"
portfolio_risk_agent = "plugins/portfolio-risk-agent/src/portfolio_risk_agent"

[tool.setuptools.package-data]
financeclaw_spike = ["py.typed"]
harness_contracts = ["py.typed"]
harness_context = ["py.typed"]
harness_events = ["py.typed"]
harness_memory = ["py.typed"]
harness_spi = ["py.typed"]
harness_registry = ["py.typed"]
harness_selection = ["py.typed"]
harness_plugin_local = ["py.typed"]
harness_policy = ["py.typed"]
harness_trace = ["py.typed"]
harness_runtime = ["py.typed"]
harness_bootstrap = ["py.typed"]
calculator_tool = ["py.typed"]
echo_agent = ["py.typed"]
mock_finance_agent = ["py.typed"]
portfolio_risk_agent = ["py.typed"]
