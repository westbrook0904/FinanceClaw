[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "financeclaw"
version = "0.1.0"
description = "A financial agent platform built on LangChain and LangGraph."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.17,<2",
    "fastapi>=0.141,<1",
    "httpx>=0.28,<1",
    "langchain>=1.3.16,<2",
    "langchain-mcp-adapters>=0.2,<1",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langgraph-checkpoint-redis>=0.2,<1",
    "langgraph-cli[inmem]>=0.4,<1",
    "langgraph-sdk>=0.3,<1",
    "langsmith>=0.4,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "redis>=6,<8",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "external: requires live credentials or services",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools]
py-modules = ["main"]
packages = [
    "financeclaw",
    "financeclaw.agents",
    "financeclaw.api",
    "financeclaw.application",
    "financeclaw.artifacts",
    "financeclaw.audit",
    "financeclaw.conversation",
    "financeclaw.contracts",
    "financeclaw.delegation",
    "financeclaw.graphs",
    "financeclaw.graphs.workflows",
    "financeclaw.infrastructure",
    "financeclaw.infrastructure.migrations",
    "financeclaw.infrastructure.migrations.versions",
    "financeclaw.memory",
    "financeclaw.models",
    "financeclaw.tools",
    "financeclaw.workflows",
    "harness_contracts",
    "harness_events",
    "harness_trace",
]

[tool.setuptools.package-dir]
financeclaw = "financeclaw"
"financeclaw.agents" = "financeclaw/agents"
"financeclaw.api" = "financeclaw/api"
"financeclaw.application" = "financeclaw/application"
"financeclaw.artifacts" = "financeclaw/artifacts"
"financeclaw.audit" = "financeclaw/audit"
"financeclaw.conversation" = "financeclaw/conversation"
"financeclaw.contracts" = "financeclaw/contracts"
"financeclaw.delegation" = "financeclaw/delegation"
"financeclaw.graphs" = "financeclaw/graphs"
"financeclaw.graphs.workflows" = "financeclaw/graphs/workflows"
"financeclaw.infrastructure" = "financeclaw/infrastructure"
"financeclaw.infrastructure.migrations" = "financeclaw/infrastructure/migrations"
"financeclaw.infrastructure.migrations.versions" = "financeclaw/infrastructure/migrations/versions"
"financeclaw.memory" = "financeclaw/memory"
"financeclaw.models" = "financeclaw/models"
"financeclaw.tools" = "financeclaw/tools"
"financeclaw.workflows" = "financeclaw/workflows"
harness_contracts = "harness-contracts/src/harness_contracts"
harness_events = "harness-events/src/harness_events"
harness_trace = "harness-trace/src/harness_trace"

[tool.setuptools.package-data]
financeclaw = [
    "py.typed",
    "infrastructure/migrations/*.py",
    "infrastructure/migrations/*.mako",
    "infrastructure/migrations/versions/*.py",
]
harness_contracts = ["py.typed"]
harness_events = ["py.typed"]
harness_trace = ["py.typed"]
