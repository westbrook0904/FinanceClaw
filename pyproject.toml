[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "financeclaw"
version = "0.1.0"
description = "A financial agent platform built on LangChain and LangGraph."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.17,<2",
    "boto3>=1.40,<2",
    "fastapi>=0.141,<1",
    "httpx>=0.28,<1",
    "langchain>=1.3.16,<2",
    "langchain-mcp-adapters>=0.2,<1",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.1,<2",
    "langgraph-sdk>=0.3,<1",
    "langsmith>=0.4,<1",
    "lark-channel-sdk>=1.4,<2",
    "opentelemetry-api>=1.42,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.42,<2",
    "opentelemetry-sdk>=1.42,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "pyjwt[crypto]>=2.13,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
agent-server = [
    "langgraph-checkpoint-postgres>=3,<4",
    "langgraph-checkpoint-redis>=0.2,<1",
    "langgraph-cli>=0.4,<1",
    "redis>=6,<8",
]
dev = [
    "langgraph-cli[inmem]>=0.4,<1",
    "pip-audit>=2.9,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "external: requires live credentials or services",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = [
    "D105",  # 魔术方法在调用位置已经能够表达自身语义。
    "D107",  # 类文档已经统一说明构造语义。
    "D203",  # 采用与 PEP 257 兼容的 D211 布局。
    "D213",  # 多行说明的摘要放在起始行。
    "D400",  # Ruff 尚不能识别中文句号作为结尾标点。
    "D415",  # 中文说明统一使用全角句号。
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["financeclaw*"]

[tool.setuptools.package-data]
financeclaw = [
    "py.typed",
    "infrastructure/migrations/*.py",
    "infrastructure/migrations/*.mako",
    "infrastructure/migrations/versions/*.py",
]
