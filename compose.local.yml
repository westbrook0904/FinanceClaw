name: financeclaw-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: financeclaw_app
      POSTGRES_USER: financeclaw
      POSTGRES_PASSWORD: financeclaw-local
    command: ["postgres", "-c", "shared_preload_libraries=vector"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - local-postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init-local.sql:/docker-entrypoint-initdb.d/10-financeclaw.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeclaw -d financeclaw_app"]
      interval: 5s
      timeout: 3s
      retries: 20

  artifact-store:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: financeclaw
      MINIO_ROOT_PASSWORD: financeclaw-local-minio
      # 本地静态 KMS：密钥由未跟踪文件挂载，不写入镜像或容器环境变量。
      MINIO_KMS_SECRET_KEY_FILE: /run/secrets/minio_kms_key
    secrets:
      - minio_kms_key
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - local-artifacts:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  artifact-init:
    image: minio/mc:latest
    depends_on:
      artifact-store:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://artifact-store:9000 financeclaw financeclaw-local-minio
        mc mb --ignore-existing local/financeclaw-artifacts
        mc anonymous set none local/financeclaw-artifacts
        mc encrypt set sse-s3 local/financeclaw-artifacts
    restart: "no"

secrets:
  minio_kms_key:
    file: ./.env.minio-kms.local

volumes:
  local-postgres: {}
  local-artifacts: {}
